name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/okun16/dnd-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}


  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      packages: read
    steps:
      - name: Use a temporary Docker config
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy new version
        run: |
          docker pull $IMAGE:${{ github.sha }}
          docker rm -f dnd || true
          docker run -d --name dnd --restart unless-stopped -p 8080:80 $IMAGE:${{ github.sha }}

      - name: Health check
        run: |
          sleep 3
          curl -fsS http://localhost:8080 > /dev/null && echo "Site is up"

      - name: Clean old images
        run: docker image prune -f